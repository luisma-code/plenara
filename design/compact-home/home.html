gap:7px;margin:0 20px 8px}.filters select{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 9px;font-size:12px;flex:1}.filters button{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:0 12px;font-size:12px;white-space:nowrap}.filters button.active{background:var(--lavender);border-color:var(--plum);color:var(--plum)}.active-summary{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--plum);margin:0 20px}.active-summary button{font-size:12px;padding:0;flex-shrink:0;min-width:44px}.result-head{display:flex;justify-content:space-between;align-items:center;padding:0 20px;min-height:39px;font-size:12px;color:var(--muted)}.result-head select{border:0;background:transparent;max-width:170px;font-size:12px;min-height:44px;color:var(--plum)}.list{margin:0 20px 14px}.person{border-bottom:1px solid var(--line)}.person:first-child{border-top:1px solid var(--line)}.person.open{background:var(--lavender);border-radius:14px;border-color:transparent;margin-top:4px}.row{display:flex;align-items:center;min-height:80px;gap:10px}.person-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left;padding:10px 0;min-height:80px}.open .person-main{padding-left:10px}.avatar{width:37px;height:37px;border-radius:50%;background:#d9cbe3;color:#51415f;display:grid;place-items:center;flex-shrink:0;font:15px Georgia,serif}.copy{min-width:0}.name{font-size:15px;font-weight:650;display:block;margin-bottom:2px}.meta,.reason{display:block;font-size:12px;line-height:1.5;color:var(--muted)}.reason.due{color:var(--plum);font-weight:550}.more{width:44px;flex-shrink:0;padding:0;font-size:21px;color:var(--plum);letter-spacing:1px}.row-actions{padding:0 10px 10px;display:flex;flex-wrap:wrap;gap:7px}.row-actions button{background:var(--card);border:1px solid var(--line);border-radius:11px;font-size:12px;flex:1;white-space:nowrap;padding:0 10px}.row-actions button:first-child{background:#65516f;color:white;border-color:transparent}.row-actions .history{flex-basis:100%;color:var(--plum);background:transparent;border:0;text-align:left;padding-left:0}.setup{margin:0 20px 22px;padding:14px 16px;border-radius:16px;background:var(--sage);font-size:13px}.setup strong{display:block;font-weight:650;margin-bottom:4px}.setup p{color:var(--muted);margin:0;font-size:12px;line-height:1.5}.setup button{color:var(--plum);font-size:12px;font-weight:600;text-align:left;padding:0;margin-top:4px}.empty{padding:30px 0}.empty h2{font:23px Georgia;margin:0 0 10px}.empty p{font-size:14px;color:var(--muted);line-height:1.55}.empty button{color:var(--plum);padding:0;font-weight:600;font-size:13px}.preview{font-size:9px;letter-spacing:1.2px;text-align:center;color:var(--muted);margin:18px 20px 24px}.nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:7px 12px 23px;z-index:2}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;min-height:49px;color:var(--muted)}.nav .on{color:var(--plum);font-weight:650}.indicator{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;background:var(--ink);border-radius:6px;z-index:3}body{padding-bottom:85px}body.full{position:relative;padding-bottom:0}body.full .nav{position:relative}body.full .indicator{position:absolute}.backdrop{position:fixed;inset:0;background:#17131d55;z-index:4}dialog{position:fixed;inset:auto 0 0;width:100%;max-width:500px;max-height:90dvh;margin:0 auto;padding:0;background:var(--paper);color:var(--ink);border:0;border-radius:24px 24px 0 0;z-index:5;overflow:auto}dialog::backdrop{background:#17131d60}.handle{width:34px;height:4px;background:var(--line);border-radius:8px;margin:10px auto 2px}.sheet-header{display:flex;justify-content:space-between;align-items:center;margin:0 20px 5px}.sheet-header h2{font:26px Georgia;margin:0}.sheet-header button{color:var(--plum);font-size:14px;font-weight:600}.sheet-content{padding:0 20px 18px}.sheet-content p{font-size:13px;color:var(--muted);margin:0 0 15px;line-height:1.55}.field{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:55px;font-size:14px}.field select{border:0;background:transparent;max-width:58%;text-align:right;color:var(--plum);font-size:13px}.sheet-content input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card)}.sheet-actions{display:flex;gap:10px;padding:14px 20px 27px;border-top:1px solid var(--line);background:var(--paper);position:sticky;bottom:0}.sheet-actions button{border:1px solid var(--line);border-radius:13px;flex:1;font-size:14px;font-weight:600;background:var(--card)}.sheet-actions .primary{background:#65516f;color:white;border-color:transparent}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.detail-actions button{border:1px solid var(--line);border-radius:12px;flex:1;min-width:130px;color:var(--plum);font-size:13px}.sheet-content .notice{padding:12px;background:var(--lavender);border-radius:12px;margin-top:14px}.sheet-content label.date{display:block;font-size:13px;margin:16px 0 6px}
@media(max-width:350px){.filters{gap:5px}.filters select{padding:0 5px;font-size:11px}.filters button{padding:0 8px;font-size:11px}.name{font-size:14px}.meta,.reason{font-size:11px}.person-main{gap:8px}}
.system{display:flex;align-items:center;gap:5px}.system svg{width:17px;height:17px;stroke-width:2}.system .battery{width:24px}.setup{padding:8px 0 0;border-radius:0;background:transparent;border-top:1px solid var(--line);margin-top:18px}.setup button{margin:0}</style></head><body><svg style="display:none" aria-hidden="true"><defs><symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol><symbol id="people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.9"/><circle cx="9" cy="7" r="4"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="edit" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6ZM14 5l5 5M21 15v6H3V3h6"/></symbol><symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol></defs></svg>
<div class="status"><span>9:41</span><div class="island"></div><span class="system"><svg viewBox="0 0 20 20"><path d="M2 15v-3m4 3V9m4 6V6m4 9V3"/></svg><svg viewBox="0 0 20 20"><path d="M2 7q8-7 16 0M5 10q5-5 10 0M8 13q2-2 4 0"/><circle cx="10" cy="16" r=".6"/></svg><svg class="battery" viewBox="0 0 28 16"><rect x="1" y="2" width="23" height="12" rx="3"/><path d="M27 6v4"/><rect x="4" y="5" width="17" height="6" rx="1" fill="currentColor" stroke="none"/></svg></span></div>
<header><div class="brandbar"><div class="brand"><span>✳</span>plenara</div><button class="icon" id="settings" aria-label="Reminder settings"><svg><use href="#bell"/></svg></button></div><div class="heading"><h1>Follow up</h1><button class="log" id="log">＋ Log contact</button></div></header>
<div class="tabs" role="group" aria-label="Relationship type"><button data-tab="All" aria-pressed="true">All</button><button data-tab="Family" aria-pressed="false">Family</button><button data-tab="Friends" aria-pressed="false">Friends</button></div>
<div class="filters"><select id="closeness" aria-label="Closeness"><option value="">Any closeness</option><option>Inner circle</option><option>Close</option><option>Casual</option><option>Not set</option></select><select id="followup" aria-label="Follow-up status"><option value="">All suggestions</option><option value="due">Due reminders</option><option value="unknown">No history</option></select><button id="filters">Filters</button></div>
<div class="active-summary" id="active" hidden><span></span><button id="clear">Clear</button></div>
<div class="result-head"><span id="count" aria-live="polite"></span><select id="sort" aria-label="Sort people"><option value="priority">Priority order</option><option value="closeness">Closest first</option><option value="last">Oldest contact first</option></select></div>
<main><div id="list" class="list"></div><aside class="setup" id="setup"><p>No contact dates recorded yet.</p><button id="setup-reminders">Set up reminders →</button></aside><div class="preview">DESIGN PREVIEW · FICTIONAL PEOPLE</div></main>
<nav class="nav" aria-label="Main navigation"><button class="on" id="home"><svg><use href="#heart"/></svg>Home</button><button id="people"><svg><use href="#people"/></svg>People</button><button id="history"><svg><use href="#clock"/></svg>History</button></nav><div class="indicator"></div>
<dialog id="filter-sheet" aria-labelledby="filter-title"><div class="handle"></div><div class="sheet-header"><h2 id="filter-title">Filters</h2><button id="cancel-filters">Cancel</button></div><div class="sheet-content"><p>Filters apply together. Changing them won’t change anyone’s reminder schedule.</p><input id="search" aria-label="Find someone" placeholder="Find someone"><label class="field">Relationship<select id="f-relation"><option>All</option><option>Family</option><option>Friends</option><option>Not set</option></select></label><label class="field">Closeness<select id="f-closeness"><option value="">Any</option><option>Inner circle</option><option>Close</option><option>Casual</option><option>Not set</option></select></label><label class="field">Follow-up<select id="f-followup"><option value="">All suggestions</option><option value="due">Due reminders</option><option value="unknown">No contact history</option></select></label><label class="field">Distance<select id="f-distance"><option value="">Any</option><option>Nearby</option><option>Far away</option><option>Not set</option></select></label><label class="field">What I want<select id="f-direction"><option value="">Any</option><option>Keep it steady</option><option>Grow closer</option><option>Not set</option></select></label><label class="field">How it feels<select id="f-feeling"><option value="">Any</option><option>Feels good</option><option>Needs care</option><option>Not set</option></select></label></div><div class="sheet-actions"><button id="reset-filters">Reset</button><button class="primary" id="apply-filters">Show people</button></div></dialog>
<dialog id="action-sheet" aria-labelledby="action-title"><div class="handle"></div><div class="sheet-header"><h2 id="action-title"></h2><button id="close-action">Done</button></div><div class="sheet-content" id="action-content"></div></dialog>
<script>
const params=new URLSearchParams(location.search);if(params.has('dark'))document.body.classList.add('dark');if(params.has('full'))document.body.classList.add('full');
const people=[
{id:1,name:'Zoe Park',kind:['Friend'],close:'Inner circle',distance:'Nearby',direction:'Keep it steady',feeling:'Feels good',days:null,due:false},
{id:2,name:'Samir Shah',kind:['Family','Friend'],close:'Inner circle',distance:'Far away',direction:'Keep it steady',feeling:'Feels good',days:null,due:false},
{id:3,name:'Mei Lin',kind:['Family'],close:'Close',distance:'Nearby',direction:'Keep it steady',feeling:'Feels good',days:null,due:false},
{id:4,name:'Daniel Ross',kind:['Friend'],close:'Close',distance:'Nearby',direction:'Grow closer',feeling:'Needs care',days:null,due:false},
{id:5,name:'Lena Shah',kind:['Family'],close:'Close',distance:'Nearby',direction:'Grow closer',feeling:'Feels good',days:null,due:false},
{id:6,name:'Sofia Chen',kind:['Friend'],close:'Close',distance:'Far away',direction:'Keep it steady',feeling:'Needs care',days:null,due:false},
{id:7,name:'Aaron Miller',kind:['Friend'],close:'Casual',distance:'Nearby',direction:'Grow closer',feeling:'Feels good',days:null,due:false},
{id:8,name:'Nora Ellis',kind:[],close:'Not set',distance:'Not set',direction:'Not set',feeling:'Not set',days:null,due:false}
];
if(params.has('mixed')){people[1].days=9;people[1].due=true;people[1].cadence=7;people[3].days=34;people[3].due=true;people[3].cadence=30;people[6].days=95;people[6].due=true;people[6].cadence=90;}
const state={relation:params.get('relation')||'All',closeness:params.get('closeness')||'',followup:params.get('followup')||'',distance:params.get('distance')||'',direction:params.get('direction')||'',feeling:params.get('feeling')||'',search:'',sort:'priority',open:null};
const tier={'Inner circle':0,Close:1,Casual:2,'Not set':3};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function visible(){return people.filter(p=>(state.relation==='All'||(state.relation==='Not set'?p.kind.length===0:p.kind.includes(state.relation==='Friends'?'Friend':state.relation)))&&(!state.closeness||p.close===state.closeness)&&(!state.followup||(state.followup==='due'?p.due:p.days===null))&&(!state.distance||p.distance===state.distance)&&(!state.direction||p.direction===state.direction)&&(!state.feeling||p.feeling===state.feeling)&&(!state.search||p.name.toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>{
 if(state.sort==='last')return (b.days??-1)-(a.days??-1)||tier[a.close]-tier[b.close]||a.id-b.id;
 if(state.sort==='closeness')return tier[a.close]-tier[b.close]||(b.due-a.due)||a.id-b.id;
 const band=p=>p.due&&p.close==='Inner circle'?0:!p.due&&tier[p.close]<=1?1:p.due?2:p.kind.includes('Family')&&p.close==='Not set'?3:p.direction==='Grow closer'?4:5;
 return band(a)-band(b)||(a.due&&b.due?b.days/b.cadence-a.days/a.cadence:0)||tier[a.close]-tier[b.close]||a.id-b.id;
});}
function render(){
 $('closeness').value=state.closeness;$('followup').value=state.followup;$('sort').value=state.sort;
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===state.relation)));
 const extras=[state.relation==='Not set'?'Relationship not set':'',state.distance,state.direction,state.feeling,state.search&&'Name: '+state.search].filter(Boolean);$('active').hidden=!extras.length;$('active').firstElementChild.textContent=extras.join(' · ');$('filters').textContent=extras.length?'Filters ('+extras.length+')':'Filters';$('filters').classList.toggle('active',!!extras.length);
 const rows=visible();$('count').textContent=rows.length+' '+(rows.length===1?'person':'people');
 $('list').innerHTML=rows.length?rows.map(p=>{
  const reason=p.due?'Reminder due · '+p.days+'d since contact':p.days===null?'No contact recorded':'Last recorded contact: '+p.days+'d ago';
  return '<article class="person'+(state.open===p.id?' open':'')+'" data-id="'+p.id+'"><div class="row"><button class="person-main" data-open="'+p.id+'" aria-expanded="'+(state.open===p.id)+'"><span class="avatar" style="background:'+(['#d9cbe3','#dbe4d5','#ecd3c6','#d7e2e9'][p.id%4])+'">'+p.name.split(' ').map(s=>s[0]).join('')+'</span><span class="copy"><span class="name">'+esc(p.name)+'</span><span class="meta">'+esc((p.kind.length?p.kind.join(' + ')+(p.close==='Not set'?' · Closeness not set':' · '+p.close):p.close==='Not set'?'Relationship details not set':p.close))+'</span><span class="reason'+(p.due?' due':'')+'">'+reason+'</span></span></button><button class="more" data-open="'+p.id+'" aria-label="Actions for '+esc(p.name)+'">···</button></div>'+(state.open===p.id?'<div class="row-actions"><button data-action="reach" data-person="'+p.id+'">Reach out</button><button data-action="log" data-person="'+p.id+'">Log contact</button><button data-action="later" data-person="'+p.id+'">Later</button><button class="history" data-action="date" data-person="'+p.id+'">'+(p.days===null?'Add a contact date →':'View contact history →')+'</button></div>':'')+'</article>';
 }).join(''):'<div class="empty"><h2>'+(state.followup==='due'&&!people.some(p=>p.due)?'No reminders due.':'No one matches these filters.')+'</h2><p>'+(state.followup==='due'&&!people.some(p=>p.due)?'Reminders need a schedule and a starting date. People with missing history can still appear under All suggestions.':'Change a filter to see more people.')+'</p><button id="show-all">Show all suggestions →</button></div>';
 $('setup').hidden=!rows.length||state.followup==='due'||rows.every(p=>p.days!==null);
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.open);state.open=state.open===id?null:id;render()});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,people.find(p=>p.id===Number(b.dataset.person))));
 if($('show-all'))$('show-all').onclick=reset;
}
function reset(){Object.assign(state,{relation:'All',closeness:'',followup:'',distance:'',direction:'',feeling:'',search:'',open:null});render()}
function show(title,content){$('action-title').textContent=title;$('action-content').innerHTML=content;$('action-sheet').showModal()}
function action(kind,p){
 if(kind==='date')show('Contact date','<p>When did you last connect with '+esc(p.name)+'? An approximate date is fine.</p><label class="date" for="contact-date">Last contact</label><input id="contact-date" type="date"><p class="notice">This is a design preview. Nothing is saved to your journal.</p>');
 else if(kind==='reach')show('Reach out to '+p.name.split(' ')[0],'<div class="detail-actions"><button>Message</button><button>Call</button></div><p class="notice">Preview only. No message or call will be sent.</p>');
 else if(kind==='log')show('Log contact','<p>Record a conversation with '+esc(p.name)+', or an unanswered reach-out.</p><div class="detail-actions"><button>Connected</button><button>Reached out</button></div><p class="notice">Preview only. No contact has been recorded.</p>');
 else show('Show later','<p>Hide '+esc(p.name)+' from suggestions until a date you choose.</p><label class="date" for="later-date">Show again</label><input type="date" id="later-date"><p class="notice">Preview only. No reminders have changed.</p>');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.relation=b.dataset.tab;state.open=null;render()});
for(const k of ['closeness','followup','sort'])$(k).onchange=()=>{state[k]=$(k).value;state.open=null;render()};
$('filters').onclick=()=>{for(const k of ['relation','closeness','followup','distance','direction','feeling'])$('f-'+k).value=state[k];$('search').value=state.search;$('filter-sheet').showModal()};
$('cancel-filters').onclick=()=>$('filter-sheet').close();$('apply-filters').onclick=()=>{for(const k of ['relation','closeness','followup','distance','direction','feeling'])state[k]=$('f-'+k).value;state.search=$('search').value;state.open=null;$('filter-sheet').close();render()};
$('reset-filters').onclick=()=>{for(const k of ['closeness','followup','distance','direction','feeling'])$('f-'+k).value='';$('f-relation').value='All';$('search').value=''};
$('clear').onclick=()=>{state.distance=state.direction=state.feeling=state.search='';render()};
$('close-action').onclick=()=>$('action-sheet').close();
$('log').onclick=()=>show('Log contact','<div class="detail-actions"><button>One person</button><button>Group event</button></div><p class="notice">Design preview. Choose a person’s row to see their contact actions.</p>');
for(const id of ['settings','setup-reminders'])$(id).onclick=()=>show('Reminders','<p>Choose who you want reminders for, how often, and a starting date. Changing a relationship label won’t start reminders.</p><p class="notice">Preview only. No settings have changed.</p>');
$('home').onclick=()=>window.scrollTo({top:0});$('people').onclick=()=>show('People','<p>Your full people list stays here. Home shows the people matching your current follow-up filters.</p>');$('history').onclick=()=>show('Contact history','<p>Recorded conversations and reach-outs appear here. Missing entries don’t mean you haven’t spoken.</p>');
window.preview={state,people,visible,render,reset};render();
</script></body></html>
