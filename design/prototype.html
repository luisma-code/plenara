<style>

x-width:245px}.hero .meta{font-size:12px;color:#62556b;margin-top:5px}.motif{position:absolute;right:-25px;top:18px;width:148px;height:148px;color:#c9b8d1;opacity:.8}.motif svg{width:100%;height:100%;stroke-width:.6}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.avatar{width:49px;height:49px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#d7d3e3;color:#51415f;font:20px Georgia,serif;position:relative;isolation:isolate}.avatar.large{width:68px;height:68px;font-size:28px;background:#d3c1df}.avatar.sage{background:#dbe4d5;color:#4e654d}.avatar.clay{background:#ecd3c6;color:#80533c}.avatar.blue{background:#d7e2e9;color:#466072}.avatar.rose{background:#eed8df;color:#87566b}.pill{display:inline-flex;gap:5px;align-items:center;border-radius:30px;padding:5px 10px;font-size:11px;font-weight:600;background:#faf8fc;color:#6a5376}.pill svg{width:13px;height:13px}.primary{background:var(--plum);color:white;border-radius:15px;font-size:14px;font-weight:600;padding:12px 18px;min-height:48px}.secondary{background:white;border:1px solid var(--line);border-radius:15px;font-size:14px;padding:11px 16px;min-height:48px}.wide{width:100%}.actions{display:flex;gap:8px;margin-top:19px}.actions>*{flex:1;font-size:13px;padding-left:10px;padding-right:10px}.actions svg{width:18px;height:18px}.hero .secondary{background:transparent;border-color:#d5cadb}.person{border:1px solid var(--line);background:var(--card);border-radius:21px;margin-bottom:10px;padding:15px}.person>button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:0}.person h3{font-size:15px}.small{font-size:12px}.person .small{margin-top:4px}.grow{flex:1;min-width:0}.arrow{font-size:21px;color:#978c9c}.local{background:var(--green);padding:20px;border-radius:22px;margin-bottom:20px}.local p{font-size:14px;color:#5d6a5c}.local h3{font:24px Georgia,serif;margin-top:8px}.local .link{color:#445f45}.footer-note{font-size:12px;text-align:center;color:var(--muted);padding:10px 10px 4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--paper);border-top:1px solid var(--line);display:flex;padding:8px 14px max(14px,env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;font-size:10px;color:var(--muted);min-height:55px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.nav .selected{color:var(--plum);font-weight:700}.nav .selected svg{stroke-width:2.2}.search{display:flex;gap:9px;align-items:center;background:#eeebe7;border-radius:14px;padding:3px 13px;margin:22px 0 12px}.search svg{width:19px;color:var(--muted)}input[type=search]{border:0;outline:0;background:none;width:100%;min-height:44px;color:var(--ink)}.filters{display:flex;gap:7px;overflow:auto;padding:0 0 8px;margin-bottom:13px}.chip{font-size:12px;white-space:nowrap;border:1px solid var(--line);border-radius:24px;padding:0 14px;min-height:40px;background:var(--card)}.chip.on{background:var(--plum);color:white;border-color:var(--plum)}.rule{height:1px;background:var(--line);margin:22px 0}.back{padding:0;color:var(--plum);font-size:14px;display:flex;align-items:center;gap:5px}.back svg{width:17px}.profile-head{text-align:center;padding-top:16px}.profile-head .avatar{margin:auto;width:88px;height:88px;font-size:34px}.profile-head h1{font-size:38px;overflow-wrap:anywhere}.profile-head .muted{font-size:14px}.tags{display:flex;justify-content:center;gap:6px;margin:14px 0}.tags .pill{background:#ebe7e4;color:#655c69}.deepen{border:1px solid #d6cadb;background:var(--lavender);border-radius:14px;color:var(--plum);font-size:13px;padding:9px 15px}.card{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:20px;margin-top:18px}.card.tint{background:var(--peach);border-color:transparent}.card .eyebrow{font-size:10px}.card h3{font:24px Georgia,serif;margin:8px 0}.card p{font-size:14px;line-height:1.55}.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;margin-top:13px}.dot{width:6px;height:6px;border-radius:50%;background:#a48aaa;display:inline-block;margin-right:7px}.memory{padding:15px 0;border-bottom:1px solid var(--line);font-size:14px}.memory:last-child{border:0}.memory .small{color:var(--muted);margin-top:5px}.event{display:flex;gap:13px;margin:0 0 22px}.event-mark{width:35px;height:35px;border-radius:50%;background:var(--lavender);display:grid;place-items:center;flex-shrink:0}.event-mark svg{width:17px}.event h3{font-size:14px}.event p{font-size:13px;margin:4px 0}.event .small{color:var(--muted);font-size:11px}.empty{padding:30px 16px;text-align:center;color:var(--muted)}.demo{font-size:10px;color:var(--muted);letter-spacing:.1px;text-align:center;margin-top:18px}dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(440px,100%);max-height:90dvh;position:fixed;top:auto;bottom:0;margin:0 auto;border-radius:28px 28px 0 0;overflow:auto;box-shadow:0 -10px 70px #302c3920}dialog::backdrop{background:#28202d66}.sheet{padding:14px 25px 30px}.handle{width:34px;height:4px;background:#d7d0d7;border-radius:8px;margin:0 auto 8px}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h2{font-size:28px}label{display:block;font-size:13px;font-weight:600;margin:15px 0 7px}input:not([type=checkbox]):not([type=search]),textarea,select{width:100%;border:1px solid #d9d1d8;background:var(--card);border-radius:12px;min-height:46px;padding:10px 12px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.help{font-size:12px;color:var(--muted);line-height:1.5}.sheet .primary{margin-top:22px}.checkrow{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;min-height:62px;font-size:15px;font-weight:400;margin:0}input[type=checkbox]{accent-color:var(--plum);width:21px;height:21px}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:15px;padding:12px 20px;font-size:13px;z-index:10;max-width:340px;width:max-content;box-shadow:0 4px 25px #302c3922}.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.toggle-row label{margin:0}.notice{padding:12px;border-radius:12px;background:var(--lavender);font-size:12px;line-height:1.6;margin-top:14px}.quiet-button{font-size:12px;color:var(--muted);text-decoration:underline;min-height:44px}.person:has(button:focus-visible){outline:2px solid var(--plum)}@media(min-width:600px){#app{margin:28px auto;min-height:calc(100dvh - 56px);border-radius:30px;box-shadow:0 20px 100px #302c3912}.nav{bottom:0;border-radius:20px 20px 0 0}}@media(prefers-reduced-motion:no-preference){/* No motion is authored in this design prototype. */}
</style></head><body><div id="app"></div><dialog id="modal" aria-labelledby="sheet-title"></dialog><div id="toast" role="status" hidden></div>
<script>
const paths={heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z',people:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.9M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',moments:'M12 8v4l3 2M21 12a9 9 0 1 1-9-9M17 3h4v4',plus:'M12 5v14M5 12h14',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',leaf:'M20 4C9 2 3 7 5 15c8 6 17-1 15-11ZM4 21 15 10',arrow:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',close:'m6 6 12 12M6 18 18 6',message:'M21 11a8 8 0 0 1-8 8H8l-6 3 2-6a8 8 0 1 1 17-5',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',check:'m5 12 4 4L19 6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.heart}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date();today.setHours(12,0,0,0);const iso=d=>new Date(d).toISOString().slice(0,10);const ago=n=>iso(today.getTime()-n*86400000);const days=d=>Math.max(0,Math.round((today-new Date(d+'T12:00:00'))/86400000));
const seed={people:[
{id:1,name:'Sofia Chen',initials:'SC',color:'',kind:'Friend',close:'Close',place:'Brooklyn, New York',distance:'Far away',zone:'America/New_York',cadence:30,deepen:true,last:ago(47),notes:[{text:'Her ceramics show opens in November. Ask how the pieces are coming along.',tag:'On her mind',date:ago(47)},{text:'Sunday mornings are usually good for a call. Loves a long voice note.',tag:'Good to know',date:ago(90)},{text:'Partner: Alex. Their dog is called Miso.',tag:'Her world',date:ago(90)}]},
{id:2,name:'Daniel Rivera',initials:'DR',color:'sage',kind:'Friend',close:'Close',place:'San Francisco',distance:'Local',cadence:21,deepen:false,last:ago(26),notes:[{text:'Training for his first half marathon. Ask how the long runs are going.',tag:'On his mind',date:ago(26)}]},
{id:3,name:'Mum',initials:'M',color:'clay',kind:'Family',close:'Inner circle',place:'Madrid, Spain',distance:'Far away',zone:'Europe/Madrid',cadence:7,deepen:false,last:ago(4),notes:[{text:'Wants to show me the new balcony plants on our next call.',tag:'On her mind',date:ago(4)}]},
{id:4,name:'Amara Okafor',initials:'AO',color:'rose',kind:'Friend',close:'Getting to know',place:'Oakland',distance:'Local',cadence:30,deepen:true,last:ago(12),notes:[{text:'We both want to try the bookshop café on Telegraph.',tag:'An idea for us',date:ago(12)}]},
{id:5,name:'Leo Park',initials:'LP',color:'blue',kind:'Friend',close:'Acquaintance',place:'Seattle',distance:'Far away',cadence:90,deepen:false,last:null,notes:[]}
],events:[{id:1,person:1,type:'Video call',date:ago(47),note:'A proper catch-up. Sofia is making time for ceramics again.',status:'Connected'},{id:2,person:2,type:'In person',date:ago(26),note:'Coffee after a walk in the park.',status:'Connected'},{id:3,person:3,type:'Call',date:ago(4),note:'A slow Sunday call, and a tour of the balcony.',status:'Connected'},{id:4,person:4,type:'In person',date:ago(12),note:'Met through Maya at dinner. Talked books for an hour.',status:'Connected'}]};
let data;try{data=JSON.parse(localStorage.getItem('plenara-design-v1'))||structuredClone(seed)}catch{data=structuredClone(seed)}
let screen='home',personId=1,filter='Everyone',query='';const app=document.querySelector('#app'),modal=document.querySelector('#modal');
function save(){try{localStorage.setItem('plenara-design-v1',JSON.stringify(data))}catch{toast('Browser storage unavailable; this session still works.')}}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2600)}
function avatar(p,large=false){return `<span class="avatar ${p.color} ${large?'large':''}">${esc(p.initials)}</span>`}
function person(){return data.people.find(p=>p.id===personId)}
function since(p){if(!p.last)return 'Last contact not set';const n=days(p.last);return n===0?'Connected today':n===1?'Connected yesterday':`${n} days since connecting`}
function cadence(p){return p.cadence===0?'No regular reminder':p.cadence%7===0?`Every ${p.cadence/7===1?'week':p.cadence/7+' weeks'}`:p.cadence===30?'About once a month':p.cadence===90?'About every 3 months':`Every ${p.cadence} days`}
function go(s,id){screen=s;if(id)personId=id;query='';render();window.scrollTo(0,0)}
function nav(){return `<nav class="nav" aria-label="Main navigation">${[['home','heart','Stay close'],['people','people','People'],['moments','moments','Moments']].map(([s,i,l])=>`<button class="${screen===s||s==='people'&&screen==='person'?'selected':''}" onclick="go('${s}')" ${screen===s?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('')}</nav>`}
function row(p,detail){return `<article class="person"><button onclick="go('person',${p.id})">${avatar(p)}<span class="grow"><h3>${esc(p.name)} ${p.deepen?'<span aria-label="Want to deepen">✧</span>':''}</h3><div class="small muted">${esc(detail||p.place+' · '+p.close)}</div></span><span class="arrow">${icon('arrow')}</span></button></article>`}
function home(){const due=data.people.filter(p=>p.cadence>0&&(!p.snooze||p.snooze<=iso(today))&&p.last&&days(p.last)>=p.cadence).sort((a,b)=>(days(b.last)/b.cadence)-(days(a.last)/a.cadence));const featured=due.find(p=>p.deepen)||due[0];const local=data.people.find(p=>p.distance==='Local'&&p.deepen);return `<div class="top"><div class="brand"><b>✳</b>plenara</div><button class="icon" aria-label="Reminder preferences" onclick="settings()">${icon('bell')}</button></div><main class="content"><div class="eyebrow">${today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div><h1>A little closer.</h1><p class="intro">Small moments keep your people close.<br>Who’s on your mind today?</p><div class="section"><h2>A good time to reconnect</h2></div>${featured?`<article class="hero"><div class="motif"><svg viewBox="0 0 150 150"><ellipse cx="75" cy="75" rx="28" ry="63"/><ellipse cx="75" cy="75" rx="28" ry="63" transform="rotate(60 75 75)"/><ellipse cx="75" cy="75" rx="28" ry="63" transform="rotate(120 75 75)"/></svg></div><div class="row between">${avatar(featured,true)}${featured.deepen?`<span class="pill">${icon('leaf')} Want to deepen</span>`:`<span class="pill">Time to reconnect</span>`}</div><button style="padding:0;text-align:left" onclick="go('person',${featured.id})"><h2>${esc(featured.name)}</h2></button><div class="meta">${esc(featured.place)} · ${days(featured.last)} days since connecting</div><p>${esc(featured.notes[0]?.text||'A small hello is a lovely place to start.')}</p><div class="actions"><button class="primary" onclick="logSheet(${featured.id})">${icon('plus')} Log a moment</button><button class="secondary" onclick="go('person',${featured.id})">Catch-up notes</button></div><button class="quiet-button" onclick="snooze(${featured.id})">Another week</button></article>`:`<div class="card"><h2>Room to breathe.</h2><p class="muted">No one is due for a reminder. You can always reach out just because.</p><button class="link" onclick="go('people')">See your people →</button></div>`}${due.filter(p=>p!==featured).slice(0,2).map(p=>`<div style="margin-top:12px">${row(p,since(p)+' · '+p.distance)}</div>`).join('')}${local?`<div class="section"><h2>Make a little room</h2><span class="eyebrow">Nearby</span></div><article class="local"><div class="row">${avatar(local)}<div><h3 style="margin:0;font-size:23px">${esc(local.name.split(' ')[0])} is nearby.</h3><span class="small muted">A friendship you’d like to grow</span></div></div><p>${esc(local.notes[0]?.text||'Maybe make a plan for this week.')}</p><button class="link" onclick="go('person',${local.id})">Make a plan ${icon('arrow')}</button></article>`:''}<p class="footer-note">A little attention, at your own pace.</p><p class="demo">DESIGN PROTOTYPE · FICTIONAL PEOPLE</p></main>`}
function filtered(){return data.people.filter(p=>(p.name+' '+p.place).toLowerCase().includes(query.toLowerCase())&&(filter==='Everyone'||filter==='Deepen'&&p.deepen||filter==='Local'&&p.distance==='Local'||filter==='Far away'&&p.distance==='Far away'||filter==='Family'&&p.kind==='Family')).sort((a,b)=>a.name.localeCompare(b.name))}
function listRows(){return filtered().map(p=>row(p)).join('')||'<p class="empty">No people here yet. Try another filter, or add someone.</p>'}
function people(){return `<div class="top"><span class="eyebrow">Your circle</span><button class="icon" aria-label="Add or import people" onclick="addSheet()">${icon('plus')}</button></div><main class="content"><h1>Your people.</h1><p class="intro">Different kinds of close. All in one place.</p><div class="search">${icon('search')}<input type="search" placeholder="Find someone" aria-label="Find someone" oninput="query=this.value;document.querySelector('#list').innerHTML=listRows()"></div><div class="filters" aria-label="Filter people">${['Everyone','Deepen','Local','Far away','Family'].map(f=>`<button class="chip ${f===filter?'on':''}" aria-pressed="${f===filter}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div id="list">${listRows()}</div><button class="secondary wide" onclick="importSheet()">${icon('plus')} Import from Contacts</button><p class="help" style="text-align:center">Choose just the people you want to keep close.</p><p class="demo">Prototype import uses example contacts.</p></main>`}
function profile(){const p=person();return `<div class="top"><button class="back" onclick="go('people')">${icon('back')} Your people</button><button class="link" onclick="editSheet(${p.id})">Edit</button></div><main class="content" style="padding-top:5px"><div class="profile-head">${avatar(p,true)}<h1>${esc(p.name)}</h1><p class="muted">${esc(p.place||'Location not set')}${p.zone?' · '+new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:p.zone}).format(new Date()):''}</p><div class="tags"><span class="pill">${esc(p.kind)}</span><span class="pill">${esc(p.close)}</span><span class="pill">${esc(p.distance)}</span></div><button class="deepen" aria-pressed="${p.deepen}" onclick="toggleDeepen(${p.id})">${icon('leaf')} ${p.deepen?'A relationship I want to deepen':'I’d like to deepen this'}</button></div><div class="actions"><button class="primary" onclick="logSheet(${p.id})">${icon('plus')} Log a moment</button><button class="secondary" onclick="reachSheet(${p.id})">${icon('message')} Reach out</button></div><article class="card tint"><div class="eyebrow">Before you catch up</div><h3>A thread to pick up.</h3><p>${esc(p.notes.find(n=>n.tag==='On her mind'||n.tag==='On his mind'||n.tag==='On their mind')?.text||p.notes[0]?.text||'Add something you’d love to ask them about next time.')}</p><button class="link" onclick="noteSheet(${p.id})">Add a reminder for next time →</button></article><article class="card"><div class="row between"><h3 style="font-size:22px;margin:0">Your rhythm</h3><button class="link" onclick="rhythmSheet(${p.id})">Adjust</button></div><div class="stat"><span><i class="dot"></i>${esc(cadence(p))}</span>${icon('heart')}</div><p class="help">${since(p)}${p.snooze&&p.snooze>iso(today)?' · reminders paused until '+p.snooze:''}</p></article><div class="section"><h2>Little things to remember</h2><button class="link" onclick="noteSheet(${p.id})">+ Add</button></div>${p.notes.length?p.notes.map(n=>`<div class="memory"><div class="eyebrow" style="font-size:10px;margin-bottom:6px">${esc(n.tag)}</div>${esc(n.text)}<div class="small">Noted ${new Date(n.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>`).join(''):'<p class="help">The little things can live here: their people, what they love, what’s going on.</p>'}<div class="section"><h2>Time together</h2></div>${events(p.id)}</main>`}
function events(id){const es=data.events.filter(e=>!id||e.person===id).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return es.map(e=>{const p=data.people.find(p=>p.id===e.person);return `<article class="event"><span class="event-mark">${icon(e.status==='Reached out'?'message':'heart')}</span><div><h3>${id?esc(e.type):esc(p.name)+' · '+esc(e.type)}</h3><div class="small">${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${esc(e.status)}</div>${e.note?`<p>${esc(e.note)}</p>`:''}${!id?`<button class="link" onclick="go('person',${p.id})">View ${esc(p.name.split(' ')[0])} →</button>`:''}</div></article>`}).join('')||'<p class="help">Your moments together will collect here.</p>'}
function moments(){return `<div class="top"><span class="eyebrow">A little history</span><button class="icon" aria-label="Log a moment" onclick="pickPerson()">${icon('plus')}</button></div><main class="content"><h1>Time well spent.</h1><p class="intro">The calls, coffees, and little hellos<br>that make a life together.</p><div class="rule"></div>${events()}</main>`}
function render(){app.innerHTML=(screen==='home'?home():screen==='people'?people():screen==='person'?profile():moments())+nav()}
let returnFocus;
function sheet(title,html){returnFocus=document.activeElement;modal.innerHTML=`<div class="sheet"><div class="handle"></div><div class="sheet-top"><h2 id="sheet-title">${title}</h2><button class="icon" aria-label="Close" onclick="closeSheet()">${icon('close')}</button></div>${html}</div>`;modal.showModal()}
function closeSheet(){modal.close();if(returnFocus?.isConnected)returnFocus.focus()}
modal.addEventListener('click',e=>{if(e.target===modal)closeSheet()});
function logSheet(id){const p=data.people.find(p=>p.id===id);sheet('A moment with '+esc(p.name.split(' ')[0]),`<p class="help">A short note is plenty. Remember what mattered.</p><form onsubmit="saveMoment(event,${id})"><label for="type">How did you connect?</label><select id="type"><option>Call</option><option>Video call</option><option>In person</option><option>Messages</option><option>Voice notes</option></select><label for="date">When?</label><input id="date" type="date" required value="${iso(today)}" max="${iso(today)}"><label for="status">What happened?</label><select id="status"><option>Connected</option><option>Reached out</option></select><p class="help">Only “Connected” resets your contact rhythm. A sent message can stay an outreach.</p><label for="note">Anything to remember? <span class="muted">(optional)</span></label><textarea id="note" placeholder="What’s happening in their world?"></textarea><button class="primary wide" type="submit">Save moment</button></form>`)}
function saveMoment(e,id){e.preventDefault();const val=x=>modal.querySelector('#'+x).value;const date=val('date'),status=val('status'),p=data.people.find(p=>p.id===id);data.events.push({id:Date.now(),person:id,date,type:val('type'),note:val('note').trim(),status});if(status==='Connected'&&(!p.last||date>p.last))p.last=date;save();closeSheet();render();toast('A little moment, remembered.')}
function noteSheet(id){sheet('A little thing to remember',`<form onsubmit="saveNote(event,${id})"><label for="category">Keep it under</label><select id="category"><option>On their mind</option><option>Good to know</option><option>Their world</option><option>An idea for us</option></select><label for="memory">Your note</label><textarea id="memory" required placeholder="Their new project, a favourite place, something to ask…"></textarea><button type="submit" class="primary wide">Keep this</button></form>`)}
function saveNote(e,id){e.preventDefault();const input=modal.querySelector('#memory');if(!input.value.trim()){input.setCustomValidity('Add a little note first.');input.reportValidity();input.oninput=()=>input.setCustomValidity('');return}data.people.find(p=>p.id===id).notes.unshift({text:input.value.trim(),tag:modal.querySelector('#category').value,date:iso(today)});save();closeSheet();render();toast('Saved for your next catch-up.')}
function toggleDeepen(id){const p=data.people.find(p=>p.id===id);p.deepen=!p.deepen;save();render();toast(p.deepen?'Marked as a relationship to deepen. Your rhythm is yours to adjust.':'Deepening intention removed.')}
function snooze(id){data.people.find(p=>p.id===id).snooze=iso(today.getTime()+7*86400000);save();render();toast('A little space. We’ll remind you in a week.')}
function rhythmSheet(id){const p=data.people.find(p=>p.id===id);sheet('Find your rhythm',`<p class="help">How often would you like to connect with ${esc(p.name.split(' ')[0])}? Choose what feels right for this relationship.</p><form onsubmit="event.preventDefault();data.people.find(p=>p.id===${id}).cadence=Number(document.querySelector('#rhythm').value);save();closeSheet();render();toast('Your rhythm, updated.')"><label for="rhythm">A gentle reminder</label><select id="rhythm">${[[7,'Every week'],[14,'Every 2 weeks'],[21,'Every 3 weeks'],[30,'About once a month'],[60,'About every 2 months'],[90,'About every 3 months'],[0,'No regular reminder']].map(([v,l])=>`<option value="${v}" ${p.cadence===v?'selected':''}>${l}</option>`).join('')}</select><p class="notice">Distance changes the kind of connection we suggest. Closeness and your intention to deepen help you choose a rhythm. You always have the final say.</p><button class="primary wide">Save rhythm</button></form>`)}
function reachSheet(id){sheet('A small hello',`<p>Send a message, call, or make a plan.</p><p class="help">The iPhone app will open your chosen contact method. This browser design doesn’t send messages or make calls.</p><button class="primary wide" onclick="closeSheet();logSheet(${id})">Log an outreach instead</button>`)}
function pickPerson(){sheet('Who was it with?',data.people.map(p=>`<div class="person"><button onclick="closeSheet();logSheet(${p.id})">${avatar(p)}<span>${esc(p.name)}</span></button></div>`).join(''))}
function addSheet(){sheet('Bring your people in',`<p class="help">Start with a few people. Your whole address book doesn’t have to become a to-do list.</p><button class="primary wide" onclick="closeSheet();importSheet()">Choose from Contacts</button><button class="secondary wide" style="margin-top:12px" onclick="closeSheet();editSheet()">Add someone yourself</button>`)}
const examples=[{id:101,name:'Maya Thompson',initials:'MT',color:'rose'},{id:102,name:'Uncle Rafael',initials:'UR',color:'clay'},{id:103,name:'Nina Patel',initials:'NP',color:'sage'}];
function importSheet(){const available=examples.filter(p=>!data.people.some(x=>x.id===p.id));sheet('Choose your people',`<p class="help">In the iPhone app, you’ll choose contacts using Apple’s permission controls, then review who to bring into Plenara.</p><p class="notice">Demo only: these are fictional contacts. This prototype cannot read your address book.</p><form onsubmit="importPeople(event)">${available.length?available.map(p=>`<label class="checkrow"><input type="checkbox" name="contact" value="${p.id}">${avatar(p)}<span>${p.name}</span></label>`).join(''):'<p>All example contacts are already imported.</p>'}<button class="primary wide" ${available.length?'':'disabled'}>Import selected people</button></form>`)}
function importPeople(e){e.preventDefault();const ids=[...modal.querySelectorAll('input:checked')].map(x=>Number(x.value));if(!ids.length){toast('Choose at least one person.');return}examples.filter(p=>ids.includes(p.id)).forEach(p=>data.people.push({...p,kind:'Friend',close:'Not set',place:'',distance:'Not set',cadence:0,deepen:false,last:null,notes:[]}));save();closeSheet();filter='Everyone';go('people');toast(`${ids.length} ${ids.length===1?'person':'people'} added. Set a rhythm when you’re ready.`)}
function editSheet(id){const p=id?data.people.find(p=>p.id===id):null;sheet(p?'About '+esc(p.name.split(' ')[0]):'Add someone',`<form onsubmit="savePerson(event,${id||0})"><label for="name">Name</label><input id="name" required maxlength="80" value="${esc(p?.name||'')}"><label for="kind">Relationship</label><select id="kind">${['Friend','Family'].map(s=>`<option ${p?.kind===s?'selected':''}>${s}</option>`).join('')}</select><label for="closeness">Closeness</label><select id="closeness">${['Not set','Inner circle','Close','Getting to know','Acquaintance'].map(s=>`<option ${p?.close===s?'selected':''}>${s}</option>`).join('')}</select><label for="place">City or area <span class="muted">(optional)</span></label><input id="place" value="${esc(p?.place||'')}"><label for="distance">Near or far?</label><select id="distance">${['Not set','Local','Far away'].map(s=>`<option ${p?.distance===s?'selected':''}>${s}</option>`).join('')}</select><p class="help">You decide what “local” means. No location tracking.</p><button class="primary wide">${p?'Save changes':'Add person'}</button></form>`)}
function savePerson(e,id){e.preventDefault();const value=x=>modal.querySelector('#'+x).value.trim();if(!value('name'))return;let p=id?data.people.find(p=>p.id===id):{id:Date.now(),color:'blue',cadence:0,deepen:false,last:null,notes:[]};if(id&&p.place!==value('place'))delete p.zone;Object.assign(p,{name:value('name'),initials:value('name').split(/\s+/).slice(0,2).map(s=>s[0]).join(''),kind:value('kind'),close:value('closeness'),distance:value('distance'),place:value('place')});if(!id)data.people.push(p);save();closeSheet();go('person',p.id);toast('Person saved.')}
function settings(){sheet('Gentle reminders',`<p>A small invitation to reconnect, at a time that suits you.</p><p class="help">Proposed iPhone behavior: one weekly digest, chosen time, quiet hours, and optional birthday reminders. Notifications are opt-in.</p><div class="notice">This is a browser prototype. It doesn’t schedule or send notifications. All example changes stay in this browser.</div><button class="secondary wide" style="margin-top:20px" onclick="closeSheet();resetSheet()">Reset example data</button>`)}
function resetSheet(){sheet('Start the demo again?',`<p class="help">This clears only this prototype’s example edits in this browser.</p><button class="primary wide" onclick="data=structuredClone(seed);save();closeSheet();go('home');toast('Example data restored.')">Reset example data</button>`)}
render();
</script></body></html>
